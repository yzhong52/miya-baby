name: miya_baby
description: Baby daily-routine tracker — feedings, diapers, sleep, growth.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.4.0
  intl: ^0.19.0
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  # FlutterFire is held on its previous major (Firebase iOS SDK 12.x):
  # SDK 13 needs gtm-session-fetcher 4+, but google_sign_in_ios still uses
  # GoogleSignIn 9, which needs 3.x, so iOS can't resolve packages. Move
  # all three together once google_sign_in_ios ships GoogleSignIn 10.
  firebase_core: ^4.15.2
  cloud_firestore: ^6.10.2
  firebase_auth: ^6.7.1
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^4.4.0
  # Below 8.1 until fake_cloud_firestore implements its new
  # FieldValue.minimum/maximum (4.4.0 doesn't compile against them).
  cloud_firestore_platform_interface: ">=8.0.7 <8.1.0"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
